[package]
name = "boardcreate"
version = "0.1.0"
description = "Local infinite inspiration board backed by ComfyUI"
authors = ["sunsh"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boardcreate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-tungstenite = "=0.30.0"
futures-util = "=0.3.34"
uuid = { version = "=1.29.0", features = ["v4"] }
imagesize = "=0.15.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "query"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
